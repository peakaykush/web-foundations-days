<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Home</title>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>A simple, lightweight note-taking app to capture your thoughts instantly.</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Capture a Note</h2>
      <form action="#" method="post">
        <div>
          <label for="note-title">Title</label>
          <input type="text" id="note-title" name="note-title" placeholder="Note title">
        </div>
        <div>
          <label for="note-content">Note Content</label>
          <textarea id="note-content" name="note-content" rows="4" placeholder="Write your note here..."></textarea>
        </div>
        <button type="submit">Add Note</button>
      </form>
    </section>

    <section>
      <h2>Your Notes</h2>
      <p>No notes saved yet. Start typing above to create your first note!</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. All rights reserved.</p>
  </footer>
</body>
</html>
